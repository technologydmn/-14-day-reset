<body>
<div class="app">
  <div class="shell">
    <aside class="side">
      <div class="brand">FOR<span>M</span></div>
      <nav id="sideNav"></nav>
      <div class="side-foot">4 weeks · 5 days/week<br>Progress saves on this device.</div>
    </aside>
    <main class="main">
      <section id="todayView" class="view active"></section>
      <section id="planView" class="view"></section>
      <section id="formView" class="view"></section>
      <section id="progressView" class="view"></section>
    </main>
  </div>
  <nav class="bottom" id="bottomNav"></nav>
</div>

<div class="overlay" id="exerciseOverlay" role="dialog" aria-modal="true"><div class="modal" id="exerciseModal"></div></div>
<div class="overlay" id="runnerOverlay" role="dialog" aria-modal="true"><div class="modal runner" id="runnerModal"></div></div>
<div class="overlay" id="checkinOverlay" role="dialog" aria-modal="true"><div class="modal" id="checkinModal"></div></div>
<div class="overlay" id="settingsOverlay" role="dialog" aria-modal="true"><div class="modal" id="settingsModal"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const STORE='form-calisthenics-v1';
  const todayISO=()=>new Date().toISOString().slice(0,10);
  const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
  const defaultState={name:'Raju',startDate:todayISO(),selectedWeek:1,completed:{},habits:{},checkins:[{date:todayISO(),weight:66,waist:'',pushups:'',plank:'',squats:''}],baseline:{weight:66,waist:'',pushups:'',plank:'',squats:''}};
  let state=load(); let currentView='today'; let search=''; let category='All'; let detail=null; let runner=null; let restTimer=null;
  function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){return structuredClone(defaultState)}}
  function save(){localStorage.setItem(STORE,JSON.stringify(state));renderAll()}
  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
  const icons={today:'◫',plan:'▤',form:'⚝',progress:'▥'};
  const views=['today','plan','form','progress'];

  const exercises={
    squat:{name:'Bodyweight squat',cat:'Lower',pose:'squat',dose:'12–15 reps',seconds:0,cues:['Feet about shoulder-width','Sit hips down and back','Stand tall through whole foot'],dos:['Keep knees tracking over toes','Keep chest comfortably lifted'],donts:['Let knees collapse inward','Lift your heels'],easier:'Sit to a chair',harder:'Add a pause or backpack'},
    inclinePush:{name:'Incline push-up',cat:'Upper',pose:'pushup',dose:'6–12 reps',seconds:0,cues:['Hands on stable support','Body stays in one line','Chest moves toward support'],dos:['Brace your core','Keep elbows about 30–45°'],donts:['Pike or drop your hips','Flare elbows straight out'],easier:'Use a higher surface',harder:'Use a lower surface'},
    row:{name:'Backpack row',cat:'Upper',pose:'row',dose:'10–15 reps',seconds:0,cues:['Hinge with a flat back','Pull bag toward lower ribs','Lower it slowly'],dos:['Draw shoulders away from ears','Keep torso still'],donts:['Round your lower back','Jerk the weight upward'],easier:'Use fewer books',harder:'Add weight or slow lowering'},
    reverseLunge:{name:'Reverse lunge',cat:'Lower',pose:'lunge',dose:'8–10 each leg',seconds:0,cues:['Step one foot back','Lower both knees','Drive through front foot'],dos:['Keep front heel planted','Stay tall through torso'],donts:['Drop onto back knee','Let front knee cave inward'],easier:'Hold a chair',harder:'Add a knee drive'},
    bridge:{name:'Glute bridge',cat:'Lower',pose:'bridge',dose:'15–20 reps',seconds:0,cues:['Feet near your hips','Squeeze glutes to lift','Lower without arching'],dos:['Keep ribs gently down','Push evenly through feet'],donts:['Overextend lower back','Push from your neck'],easier:'Use a smaller range',harder:'Pause at the top'},
    plank:{name:'Forearm plank',cat:'Core',pose:'plank',dose:'20–40 sec',seconds:30,cues:['Elbows below shoulders','Make one straight line','Brace as if being tapped'],dos:['Squeeze glutes','Breathe steadily'],donts:['Let hips sag','Hold your breath'],easier:'Place knees down',harder:'Extend the hold'},
    deadBug:{name:'Dead bug',cat:'Core',pose:'deadbug',dose:'8–12 each side',seconds:0,cues:['Press lower back down','Reach opposite arm and leg','Return with control'],dos:['Move slowly','Exhale as limbs extend'],donts:['Arch away from floor','Rush the repetition'],easier:'Move only your legs',harder:'Lower limbs closer to floor'},
    birdDog:{name:'Bird dog',cat:'Core',pose:'birddog',dose:'8–12 each side',seconds:0,cues:['Start on hands and knees','Reach opposite arm and leg','Keep hips level'],dos:['Reach long, not high','Brace before moving'],donts:['Rotate your pelvis','Arch your lower back'],easier:'Move one limb only',harder:'Pause for three seconds'},
    sidePlank:{name:'Side plank',cat:'Core',pose:'sideplank',dose:'15–30 sec/side',seconds:20,cues:['Elbow under shoulder','Lift hips into a line','Stack or stagger feet'],dos:['Push floor away','Keep head neutral'],donts:['Sink into shoulder','Let hips roll backward'],easier:'Bend lower knee',harder:'Raise top leg'},
    slowClimber:{name:'Slow mountain climber',cat:'Core',pose:'climber',dose:'10–15 each side',seconds:0,cues:['Start in high plank','Bring one knee forward','Switch without rocking'],dos:['Keep shoulders over hands','Move under control'],donts:['Bounce your hips','Shorten your plank'],easier:'Hands on a bench',harder:'Move faster with control'},
    calfRaise:{name:'Calf raise',cat:'Lower',pose:'calf',dose:'15–25 reps',seconds:0,cues:['Stand tall','Rise onto balls of feet','Lower heels slowly'],dos:['Keep ankles straight','Use full comfortable range'],donts:['Roll ankles outward','Bounce quickly'],easier:'Hold a wall',harder:'Use one leg'},
    walk:{name:'Brisk walk',cat:'Conditioning',pose:'walk',dose:'15–20 min',seconds:0,cues:['Walk at a purposeful pace','Swing arms naturally','Keep posture tall'],dos:['Wear supportive shoes','Use a pace you can sustain'],donts:['Ignore sharp pain','Turn it into an all-out run'],easier:'Use shorter intervals',harder:'Add hills'},
    pikePush:{name:'Pike push-up',cat:'Upper',pose:'pike',dose:'5–10 reps',seconds:0,cues:['Make an upside-down V','Lower head between hands','Press floor away'],dos:['Keep elbows slightly back','Control the descent'],donts:['Collapse through shoulders','Force painful depth'],easier:'Hands on a bench',harder:'Elevate your feet'},
    closePush:{name:'Close-grip incline push-up',cat:'Upper',pose:'pushup',dose:'6–12 reps',seconds:0,cues:['Hands just inside shoulders','Lower as one unit','Press without locking hard'],dos:['Keep elbows near ribs','Brace glutes and core'],donts:['Place hands too narrow','Let shoulders roll forward'],easier:'Use a higher surface',harder:'Use the floor'},
    ytw:{name:'Prone Y–T–W raise',cat:'Upper',pose:'ytw',dose:'6 each shape',seconds:0,cues:['Lie face down','Lift arms into Y, T, then W','Use small controlled lifts'],dos:['Keep neck long','Move shoulder blades'],donts:['Shrug toward ears','Swing the arms'],easier:'Do one shape at a time',harder:'Pause each lift'},
    shoulderTap:{name:'Shoulder taps',cat:'Core',pose:'shouldertap',dose:'8–12 each side',seconds:0,cues:['Use a high plank','Tap opposite shoulder','Keep hips quiet'],dos:['Widen feet if needed','Press strongly through hand'],donts:['Rotate side to side','Rush the taps'],easier:'Hands elevated',harder:'Bring feet closer'},
    hollow:{name:'Hollow hold',cat:'Core',pose:'hollow',dose:'20–30 sec',seconds:25,cues:['Press lower back down','Lift shoulders and feet','Hold a shallow banana shape'],dos:['Breathe in short calm breaths','Keep ribs tucked'],donts:['Allow back to arch','Pull on your neck'],easier:'Bend knees',harder:'Reach arms overhead'},
    splitSquat:{name:'Split squat',cat:'Lower',pose:'lunge',dose:'8–12 each leg',seconds:0,cues:['Set a long stable stance','Lower straight down','Stand through front foot'],dos:['Keep weight balanced','Use a comfortable depth'],donts:['Walk a tightrope stance','Bounce at the bottom'],easier:'Hold a chair',harder:'Rear foot elevated'},
    backpackSquat:{name:'Backpack squat',cat:'Lower',pose:'squat',dose:'10–15 reps',seconds:0,cues:['Hug bag at chest','Sit down between hips','Stand without leaning'],dos:['Secure the bag','Keep whole foot grounded'],donts:['Use a loose open bag','Round under the load'],easier:'Reduce bag weight',harder:'Add weight gradually'},

ke()}}
  function renderMiniCanvases(){document.querySelectorAll('canvas[data-pose]').forEach(c=>drawMannequin(c,c.dataset.pose,1,-.65))}

  function openExercise(id){detail={id,phase:1,angle:-.65};const e=exercises[id],m=document.querySelector('#exerciseModal');m.innerHTML=`<div class="modal-head"><div><div class="accent-label">${e.cat} · ${e.dose}</div><h2>${e.name}</h2></div><button class="close" data-close="exerciseOverlay" aria-label="Close">×</button></div><div class="visual" id="detailVisual"><canvas id="detailCanvas"></canvas><span class="drag-hint">↔ Drag to rotate</span></div><div class="controls"><button data-angle="0">Front</button><button data-angle="-0.65" class="active">45°</button><button data-angle="-1.57">Side</button><button data-phase="0">Start</button><button data-phase="1" class="active">Finish</button></div><div class="cues">${e.cues.map((c,i)=>`<div class="cue"><b>${i+1}</b><span>${c}</span></div>`).join('')}</div><div class="do-grid"><div class="do-col"><h4>Do</h4>${e.dos.map(x=>`<p>✓ ${x}</p>`).join('')}</div><div class="do-col bad"><h4>Don’t</h4>${e.donts.map(x=>`<p>× ${x}</p>`).join('')}</div></div><div class="progression"><div><small>Easier</small>${e.easier}</div><div><small>Harder</small>${e.harder}</div></div>`;openOverlay('exerciseOverlay');bindModal();const v=document.querySelector('#detailVisual'),c=document.querySelector('#detailCanvas');let down=false,last=0;const redraw=()=>drawMannequin(c,e.pose,detail.phase,detail.angle);v.onpointerdown=ev=>{down=true;last=ev.clientX;v.setPointerCapture(ev.pointerId)};v.onpointermove=ev=>{if(!down)return;detail.angle+=(ev.clientX-last)*.015;last=ev.clientX;redraw()};v.onpointerup=()=>down=false;document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{detail.angle=+b.dataset.angle;document.querySelectorAll('[data-angle]').forEach(x=>x.classList.remove('active'));b.classList.add('active');redraw()});document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{detail.phase=+b.dataset.phase;document.querySelectorAll('[data-phase]').forEach(x=>x.classList.remove('active'));b.classList.add('active');redraw()});setTimeout(redraw,20)}
  function openOverlay(id){document.querySelector('#'+id).classList.add('open');document.body.style.overflow='hidden'}
  function closeOverlay(id){document.querySelector('#'+id).classList.remove('open');document.body.style.overflow='';if(id==='runnerOverlay'&&restTimer){clearInterval(restTimer);restTimer=null}}
  function bindModal(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay(b.dataset.close))}

  function startWorkout(idx,week){runner={idx,week,exercise:0,set:0,reps:null,phase:1,angle:-.65,resting:false,stage:'warmup'};openOverlay('runnerOverlay');renderRunner()}
  function renderRunner(){const wo=workouts[runner.idx],m=document.querySelector('#runnerModal');if(runner.stage==='warmup'){m.innerHTML=`<div class="runner-top"><span>Week ${runner.week} · ${wo.title}</span><span>5 min</span></div><div class="modal-head"><div><div class="accent-label">Prepare joints and raise your temperature</div><h2>Warm-up</h2></div><button class="close" data-close="runnerOverlay">×</button></div><div class="cues"><div class="cue"><b>1</b><span>Fast march · 60 seconds</span></div><div class="cue"><b>2</b><span>Arm circles · 10 each direction</span></div><div class="cue"><b>3</b><span>Hip circles · 10 each direction</span></div><div class="cue"><b>4</b><span>Bodyweight squats · 10</span></div><div class="cue"><b>5</b><span>Hip hinges · 10</span></div><div class="cue"><b>6</b><span>Wall push-ups · 8</span></div><div class="cue"><b>7</b><span>Wrist circles · 20 seconds</span></div></div><button class="primary" style="width:100%;margin-top:16px" data-begin>Begin first exercise</button>`;bindModal();document.querySelector('[data-begin]').onclick=()=>{runner.stage='work';renderRunner()};return}const id=wo.ids[runner.exercise],e=exercises[id],p=progression[runner.week];const target=parseInt(e.dose)||10;runner.reps??=target;m.innerHTML=`<div class="runner-top"><span>Week ${runner.week} · ${wo.title}</span><span>${runner.exercise+1}/${wo.ids.length}</span></div><div class="modal-head"><div><div class="accent-label">${e.cat} · ${e.dose}</div><h2>${e.name}</h2></div><button class="close" data-close="runnerOverlay">×</button></div><div class="visual" id="runnerVisual"><canvas id="runnerCanvas"></canvas><span class="drag-hint">↔ Drag to rotate</span></div><div class="set-row">${Array.from({length:p.sets},(_,i)=>`<span class="set-pill ${i<runner.set?'done':''}">Set ${i+1}</span>`).join('')}</div><p style="color:var(--muted);margin:8px 0">${e.cues.join(' · ')}</p>${e.seconds?`<div class="rep-control"><button data-minus>−</button><div><span id="repValue">${runner.reps}</span> seconds</div><button data-plus>+</button></div>`:`<div class="rep-control"><button data-minus>−</button><div><span id="repValue">${runner.reps}</span> reps</div><button data-plus>+</button></div>`}<div class="runner-actions"><button class="secondary" data-form="${id}">View full form</button><button class="primary" data-complete-set>Complete set</button></div>`;bindModal();const c=document.querySelector('#runnerCanvas'),v=document.querySelector('#runnerVisual'),redraw=()=>drawMannequin(c,e.pose,runner.phase,runner.angle);let down=false,last=0;v.onpointerdown=ev=>{down=true;last=ev.clientX;v.setPointerCapture(ev.pointerId)};v.onpointermove=ev=>{if(!down)return;runner.angle+=(ev.clientX-last)*.015;last=ev.clientX;redraw()};v.onpointerup=()=>down=false;document.querySelector('[data-minus]').onclick=()=>{runner.reps=Math.max(1,runner.reps-(e.seconds?5:1));document.querySelector('#repValue').textContent=runner.reps};document.querySelector('[data-plus]').onclick=()=>{runner.reps+=e.seconds?5:1;document.querySelector('#repValue').textContent=runner.reps};document.querySelector('[data-form]').onclick=()=>openExercise(id);document.querySelector('[data-complete-set]').onclick=completeSet;setTimeout(redraw,20)}
  function completeSet(){runner.set++;const p=progression[runner.week],wo=workouts[runner.idx];if(runner.set>=p.sets){runner.exercise++;runner.set=0;runner.reps=null;if(runner.exercise>=wo.ids.length){state.completed[workoutKey(runner.week,runner.idx)]={date:todayISO()};localStorage.setItem(STORE,JSON.stringify(state));document.querySelector('#runnerModal').innerHTML=`<div class="modal-head"><div><div class="accent-label">Workout complete · 3 minutes</div><h2>Cool-down</h2></div></div><div class="cues"><div class="cue"><b>1</b><span>Slow walk and calm breathing · 60 seconds</span></div><div class="cue"><b>2</b><span>Hip-flexor stretch · 30 seconds each side</span></div><div class="cue"><b>3</b><span>Hamstring stretch · 30 seconds each side</span></div><div class="cue"><b>4</b><span>Chest stretch · 30 seconds</span></div><div class="cue"><b>5</b><span>Child’s pose · 45 seconds</span></div></div><p style="color:var(--muted)">Stretch gently. Do not force pain or hold your breath.</p><button class="primary" style="width:100%;margin-top:16px" data-finish>Finish and save</button>`;document.querySelector('[data-finish]').onclick=()=>{closeOverlay('runnerOverlay');renderAll();toast('Workout saved')};return}}startRest(p.rest)}
  function startRest(seconds){runner.resting=true;let left=seconds;const m=document.querySelector('#runnerModal');m.innerHTML=`<div class="rest-screen"><div class="accent-label">Rest before the next set</div><div class="rest-time" id="restTime">${left}</div><p style="color:var(--muted)">Breathe slowly. Shake out the working muscles.</p><button class="secondary" data-skip>Skip rest</button></div>`;const next=()=>{clearInterval(restTimer);restTimer=null;runner.resting=false;renderRunner()};document.querySelector('[data-skip]').onclick=next;restTimer=setInterval(()=>{left--;const e=document.querySelector('#restTime');if(e)e.textContent=left;if(left<=0)next()},1000)}

  function openCheckin(){const l=latest();document.querySelector('#checkinModal').innerHTML=`<div class="modal-head"><div><div class="accent-label">Use the same conditions each week</div><h2>Weekly check-in</h2></div><button class="close" data-close="checkinOverlay">×</button></div><form id="checkinForm"><div class="form-grid"><div class="field"><label>Date</label><input type="date" name="date" value="${todayISO()}" required></div><div class="field"><label>Weight (kg)</label><input type="number" step="0.1" name="weight" value="${esc(l.weight)}"></div><div class="field"><label>Waist at navel (cm)</label><input type="number" step="0.1" name="waist" value="${esc(l.waist)}"></div><div class="field"><label>Clean push-ups</label><input type="number" name="pushups" value="${esc(l.pushups)}"></div><div class="field"><label>Maximum plank (seconds)</label><input type="number" name="plank" value="${esc(l.plank)}"></div><div class="field"><label>Squats in 60 seconds</label><input type="number" name="squats" value="${esc(l.squats)}"></div></div><button class="primary" style="width:100%;margin-top:18px">Save check-in</button></form>`;openOverlay('checkinOverlay');bindModal();document.querySelector('#checkinForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f);state.checkins.push(o);if(state.checkins.length===1)state.baseline={...o};save();closeOverlay('checkinOverlay');toast('Check-in saved')}}
  function openSettings(){document.querySelector('#settingsModal').innerHTML=`<div class="modal-head"><div><div class="accent-label">Your program</div><h2>Settings</h2></div><button class="close" data-close="settingsOverlay">×</button></div><form id="settingsForm"><div class="form-grid"><div class="field"><label>Name</label><input name="name" value="${esc(state.name)}" required></div><div class="field"><label>Program start date</label><input type="date" name="startDate" value="${state.startDate}" required></div></div><button class="primary" style="width:100%;margin-top:18px">Save settings</button></form><div style="border-top:1px solid var(--line);margin-top:24px;padding-top:20px"><button class="secondary" data-export>Export progress backup</button><button class="secondary" style="color:var(--red);margin-left:6px" data-reset>Reset all data</button></div><p class="safety">Your workout history stays in this browser. Export a backup before clearing browser data.</p>`;openOverlay('settingsOverlay');bindModal();document.querySelector('#settingsForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.name=f.get('name');state.startDate=f.get('startDate');save();closeOverlay('settingsOverlay');toast('Settings saved')};document.querySelector('[data-export]').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='FORM-progress-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};document.querySelector('[data-reset]').onclick=()=>{if(confirm('Reset every workout, habit and check-in? This cannot be undone.')){localStorage.removeItem(STORE);state=structuredClone(defaultState);save();closeOverlay('settingsOverlay');toast('Progress reset')}}}
  document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeOverlay(o.id)}));window.addEventListener('resize',()=>{renderMiniCanvases();if(detail&&document.querySelector('#detailCanvas'))drawMannequin(document.querySelector('#detailCanvas'),exercises[detail.id].pose,detail.phase,detail.angle)});renderAll();
})();
</script>
</body>
</html>
